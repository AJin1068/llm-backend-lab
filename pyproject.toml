

[project]
name = "llm-backend-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ajin"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# 여러 도구가 [tool.이름]으로 각자 설정을 넣는 공용 파일
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
